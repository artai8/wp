version: "3.9"

# MyDrive Commercial Multi-Instance Cluster:
# Nginx LB -> 2x MyDrive API -> PostgreSQL 16 + Redis 7 + MinIO (S3 Cold Tier) + Envoy HTTP/2 gRPC

x-api-env: &api-env
  STORAGE_ROOT: /data/storage
  DATABASE_URL: postgresql://mydrive:mydrive_secret@postgres:5432/mydrive
  REDIS_URL: redis://redis:6379/0
  ARIA2_EXE: /usr/bin/aria2c
  OFFLINE_AUTO_CLEANUP: "1"
  COLD_STORAGE_TYPE: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: mydrive-cold
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin123
  S3_REGION: us-east-1
  LOCAL_CACHE_MAX_BYTES: "2147483648"
  AUTO_OFFLOAD_COLD: "1"
  ADMIN_USERS: admin
  PAYMENT_WEBHOOK_SECRET: change-this-payment-secret

services:
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: mydrive-lb
    volumes:
      - ./nginx-cluster.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - mydrive-api-1
      - mydrive-api-2
    restart: unless-stopped

  mydrive-api-1:
    image: python:3.11-slim
    container_name: mydrive-api-1
    working_dir: /app/mydrive
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends ffmpeg aria2 &&
             pip install --no-cache-dir -r /app/requirements.txt psycopg2-binary &&
             uvicorn api_server:app --host 0.0.0.0 --port 8765"
    volumes:
      - ..:/app
      - mydrive_shared_data:/data/storage
    environment:
      <<: *api-env
      INSTANCE_ID: api-node-1
      SFTP_ENABLE: "1"
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  mydrive-api-2:
    image: python:3.11-slim
    container_name: mydrive-api-2
    working_dir: /app/mydrive
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends ffmpeg &&
             pip install --no-cache-dir -r /app/requirements.txt psycopg2-binary &&
             uvicorn api_server:app --host 0.0.0.0 --port 8765"
    volumes:
      - ..:/app
      - mydrive_shared_data:/data/storage
    environment:
      <<: *api-env
      INSTANCE_ID: api-node-2
      SFTP_ENABLE: "0"
      SLICES_ENABLE: "0"
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mydrive-postgres
    environment:
      POSTGRES_USER: mydrive
      POSTGRES_PASSWORD: mydrive_secret
      POSTGRES_DB: mydrive
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mydrive-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mydrive-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: mydrive-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 2; done;
      mc mb --ignore-existing local/mydrive-cold;
      exit 0;
      "

volumes:
  mydrive_shared_data:
  pg_data:
  redis_data:
  minio_data:
