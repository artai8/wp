version: "3.9"

services:
  mydrive:
    image: python:3.11-slim
    container_name: mydrive-api
    working_dir: /app/mydrive
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends ffmpeg aria2 &&
             pip install --no-cache-dir -r /app/requirements.txt &&
             uvicorn api_server:app --host 0.0.0.0 --port 8765"
    volumes:
      - ..:/app
      - mydrive_data:/data/storage
    environment:
      STORAGE_ROOT: /data/storage
      ARIA2_EXE: /usr/bin/aria2c
      OFFLINE_AUTO_CLEANUP: "1"
      COLD_STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mydrive-cold
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      LOCAL_CACHE_MAX_BYTES: "2147483648"
      AUTO_OFFLOAD_COLD: "1"
    ports:
      - "8765:8765"
      - "8766:8766"
      - "2022:2022"
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mydrive-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  envoy-grpc:
    image: envoyproxy/envoy:v1.31-latest
    container_name: mydrive-envoy-grpc
    volumes:
      - ./envoy-grpc.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      - mydrive
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: mydrive-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin123; do sleep 2; done;
      mc mb --ignore-existing local/mydrive-cold;
      exit 0;
      "

volumes:
  mydrive_data:
  minio_data:
